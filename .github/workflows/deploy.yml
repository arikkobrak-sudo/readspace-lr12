name: CI/CD — Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    name: Test (перевірка локальних посилань)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Перевірити, що всі локальні src/href ведуть на наявні файли
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const single = [...html.matchAll(/(?<![\w-])(?:src|href)="([^"#]+)"/g)].map(m => m[1]);
            const sets = [...html.matchAll(/(?<![\w-])srcset="([^"]+)"/g)]
              .flatMap(m => m[1].split(",").map(s => s.trim().split(" ")[0]));
            const refs = [...single, ...sets]
              .filter(u => u && !/^(https?:|mailto:|tel:|data:|\/\/)/.test(u));
            const missing = [...new Set(refs)].filter(u => !fs.existsSync(u));
            if (missing.length) { console.error("Відсутні файли:", missing); process.exit(1); }
            console.log("OK:", new Set(refs).size, "локальних посилань");
          '
          test -f robots.txt && test -f sitemap.xml

  deploy:
    name: Deploy (Production)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
